<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SUPER EARTH · Loadout-Terminal — Helldivers 2</title>
<meta name="description" content="Strategisches Ausrüstungs-Advisory für Helldivers 2 — optimale Loadouts für alle Fraktionen, alle Schwierigkeitsgrade, Solo bis 4er-Trupp.">
<!-- Open Graph (für hübsche Discord-/Link-Vorschau) -->
<meta property="og:title" content="SUPER EARTH · Loadout-Terminal — Helldivers 2">
<meta property="og:description" content="Optimale Loadouts für alle Fraktionen & Schwierigkeitsgrade. Solo bis 4er-Trupp-Aufstellung. Für die Demokratie. 🦅">
<meta property="og:type" content="website">
<meta property="og:image" content="assets/og-preview.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="SUPER EARTH · Loadout-Terminal — Helldivers 2">
<meta name="twitter:description" content="Optimale Loadouts für alle Fraktionen & Schwierigkeitsgrade. Solo bis 4er-Trupp. Für die Demokratie. 🦅">
<meta name="twitter:image" content="assets/og-preview.png">
<meta name="theme-color" content="#ffe000">
<link rel="icon" type="image/png" sizes="64x64" href="assets/favicon.png">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/favicon.png">
<!-- Schriften lokal eingebunden (kein Aufruf an Google-Server, DSGVO-freundlich) -->
<link rel="stylesheet" href="assets/fonts.css">
<style>
  :root{
    --hd-yellow:#ffe000;--hd-yellow-dim:#bda400;
    --bg:#0a0c0a;--panel:#13161a;--panel-2:#191d22;--panel-3:#1f242a;
    --line:#2c3238;--line-bright:#3c454d;--text:#e9ebe7;--muted:#8a938b;
    --red:#e8362e;--green:#46c46b;
    --acc:var(--hd-yellow);      /* Fraktions-Akzent, per JS gesetzt */
    --acc-glow:rgba(255,224,0,.30);
  }
  /* Fraktions-Akzentfarben */
  body[data-faction="terminids"] {--acc:#ffb302;--acc-glow:rgba(255,179,2,.28)}
  body[data-faction="automatons"]{--acc:#ff5a52;--acc-glow:rgba(232,54,46,.32)}
  body[data-faction="illuminate"]{--acc:#9b6df0;--acc-glow:rgba(120,80,235,.34)}

  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:"Saira","Segoe UI",sans-serif;
    background:var(--bg);color:var(--text);line-height:1.5;min-height:100vh;
    position:relative;overflow-x:hidden;
  }
  /* Hazard-Streifen am Seitenrand + Scanlines-Atmosphäre */
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:
      repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0 1px,transparent 1px 3px),
      radial-gradient(ellipse at 50% -10%,var(--acc-glow),transparent 55%);
    opacity:.6;transition:background .35s;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:22px 18px 90px;position:relative;z-index:1}

  /* ====== Eckklammer-Rahmen (HUD-Motiv) ====== */
  .frame{position:relative}
  .frame::before,.frame::after{content:"";position:absolute;width:15px;height:15px;pointer-events:none}
  .frame::before{top:-1px;left:-1px;border-top:2px solid var(--hd-yellow);border-left:2px solid var(--hd-yellow)}
  .frame::after{bottom:-1px;right:-1px;border-bottom:2px solid var(--hd-yellow);border-right:2px solid var(--hd-yellow)}

  /* ====== Kopfzeile / Kommando-Leiste ====== */
  header{
    border:1px solid var(--line-bright);background:linear-gradient(180deg,#15181a,#0b0d0c);
    padding:20px 24px;margin-bottom:8px;display:flex;align-items:center;gap:22px;
    box-shadow:0 0 0 3px #000,0 18px 40px -22px #000;
  }
  .hazard{height:10px;margin-bottom:24px;
    background:repeating-linear-gradient(135deg,var(--hd-yellow) 0 22px,#0a0c0a 22px 44px);
    box-shadow:0 0 0 1px #000;}
  .crest{flex:0 0 84px;width:84px;height:84px;display:flex;align-items:center;justify-content:center;
    border:1px solid var(--line);background:radial-gradient(circle at 50% 40%,#1c2024,#0c0e0d);position:relative}
  .crest img{width:64px;height:64px;object-fit:contain;filter:drop-shadow(0 0 6px rgba(255,224,0,.25))}
  .titles{flex:1 1 auto;min-width:0}
  .kicker{font-family:"Saira Condensed";font-weight:700;letter-spacing:6px;font-size:13px;color:var(--hd-yellow);text-transform:uppercase}
  h1{font-family:"Oswald";font-weight:700;font-size:clamp(26px,4.6vw,46px);line-height:.98;
    letter-spacing:2px;text-transform:uppercase;color:#fff;text-shadow:2px 3px 0 #000}
  .sub{color:var(--muted);letter-spacing:2.5px;text-transform:uppercase;font-size:11.5px;margin-top:7px;font-weight:500}
  .stamp{flex:0 0 auto;align-self:flex-start;border:2px solid var(--red);color:var(--red);
    font-family:"Oswald";font-weight:600;letter-spacing:2px;font-size:11px;padding:4px 9px;
    text-transform:uppercase;transform:rotate(4deg);opacity:.85}
  @media(max-width:600px){.crest{display:none}.stamp{display:none}}

  /* ====== Steuer-Deck ====== */
  .controls{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:26px}
  @media(max-width:760px){.controls{grid-template-columns:1fr}}
  .group{background:var(--panel);border:1px solid var(--line);padding:15px 16px 16px}
  .group h2{font-family:"Saira Condensed";font-weight:700;font-size:13px;letter-spacing:2.5px;
    text-transform:uppercase;color:var(--acc);margin-bottom:13px;display:flex;align-items:center;gap:8px}
  .group h2 .num{display:inline-flex;width:20px;height:20px;align-items:center;justify-content:center;
    background:var(--acc);color:#0a0c0a;font-size:12px;font-weight:700;clip-path:polygon(0 0,100% 0,100% 70%,70% 100%,0 100%)}
  .group.muted{opacity:.5}
  .group .hint{font-size:11px;color:var(--muted);margin-top:10px;letter-spacing:.5px}

  .opts{display:flex;flex-wrap:wrap;gap:8px}
  .opt{
    flex:1 1 auto;min-width:80px;border:1px solid var(--line);background:var(--panel-2);color:var(--text);
    padding:10px 9px;cursor:pointer;text-transform:uppercase;letter-spacing:1px;font-size:12px;font-weight:600;
    font-family:"Saira";transition:all .13s;text-align:center;position:relative;
  }
  .opt:hover{border-color:var(--acc);background:var(--panel-3)}
  .opt.active{background:var(--acc);color:#0a0c0a;border-color:var(--acc);box-shadow:0 0 16px -2px var(--acc-glow)}
  .opt small{display:block;font-weight:400;font-size:9.5px;opacity:.72;letter-spacing:0;text-transform:none;margin-top:2px}

  /* Fraktions-Kacheln */
  .fac-opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .fac{border:1px solid var(--line);background:var(--panel-2);cursor:pointer;padding:12px 6px 9px;
    text-align:center;transition:all .14s;position:relative;overflow:hidden}
  .fac img{width:44px;height:44px;object-fit:contain;display:block;margin:0 auto 6px;
    filter:grayscale(.55) brightness(.85);transition:filter .15s,transform .15s}
  .fac .fl{font-family:"Saira Condensed";font-weight:700;font-size:12.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
  .fac:hover img{filter:none;transform:scale(1.05)}
  .fac:hover .fl{color:var(--text)}
  .fac.active{border-color:var(--fac-c);background:radial-gradient(circle at 50% 30%,color-mix(in srgb,var(--fac-c) 22%,#0a0c0a),#0a0c0a)}
  .fac.active img{filter:none;transform:scale(1.05)}
  .fac.active .fl{color:#fff}
  .fac.active::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 22px -6px var(--fac-c);pointer-events:none}
  .fac[data-val="terminids"]{--fac-c:#ffb302}
  .fac[data-val="automatons"]{--fac-c:#ff5a52}
  .fac[data-val="illuminate"]{--fac-c:#9b6df0}

  /* ====== Ergebnis ====== */
  .result{border:1px solid var(--line-bright);background:var(--panel);box-shadow:0 0 0 3px #000,0 24px 50px -30px #000}
  .result-head{background:linear-gradient(90deg,var(--acc),color-mix(in srgb,var(--acc) 55%,#000));
    color:#0a0c0a;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
  .result-head .rh-l{display:flex;align-items:center;gap:13px}
  .result-head .rh-em{width:38px;height:38px;object-fit:contain;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))}
  .result-head h3{font-family:"Oswald";font-weight:700;font-size:20px;letter-spacing:1.5px;text-transform:uppercase;line-height:1}
  .result-head .rh-sub{font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;opacity:.8;margin-top:2px}
  .result-head .tag{font-family:"Saira Condensed";font-size:12px;background:#0a0c0a;color:var(--acc);padding:5px 12px;letter-spacing:1.5px;text-transform:uppercase;font-weight:700}

  .band-banner{padding:11px 20px;background:#0d1116;color:#c6cdd4;font-size:12.5px;border-bottom:1px solid var(--line);line-height:1.4}
  .band-banner b{color:var(--acc);letter-spacing:1px;font-family:"Saira Condensed"}
  .blurb{padding:14px 20px;color:#aeb4ad;border-bottom:1px solid var(--line);font-size:13.5px}

  .section-lbl{font-family:"Saira Condensed";font-weight:700;font-size:12px;letter-spacing:2.5px;text-transform:uppercase;
    color:var(--acc);padding:17px 20px 7px;display:flex;align-items:center;gap:9px}
  .section-lbl::before{content:"";width:6px;height:13px;background:var(--acc);clip-path:polygon(0 0,100% 0,100% 75%,55% 100%,0 100%)}

  .grid{padding:4px 20px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:680px){.grid{grid-template-columns:1fr}}
  .card{display:flex;gap:13px;background:var(--panel-2);border:1px solid var(--line);padding:11px;align-items:center}
  .card:hover{border-color:var(--line-bright)}
  .thumb{width:104px;height:78px;flex:0 0 104px;background:#0a0c0d;border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
  .thumb img{max-width:100%;max-height:100%;object-fit:contain;display:block}
  .thumb.armory{background:radial-gradient(circle at 50% 35%,#22262b,#0c0e10)}
  .thumb.noimg{color:var(--muted);font-size:24px}
  .card .lbl{font-family:"Saira Condensed";font-weight:700;font-size:10.5px;letter-spacing:1.8px;text-transform:uppercase;color:var(--acc)}
  .card .val{font-size:14.5px;font-weight:600;margin-top:1px;line-height:1.2}
  .card .why{font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.4}

  .strats{padding:4px 20px;display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  @media(max-width:680px){.strats{grid-template-columns:1fr}}
  .strat{display:flex;gap:11px;background:var(--panel-2);border:1px solid var(--line);padding:9px 11px;align-items:center}
  .strat .sico{width:46px;height:46px;flex:0 0 46px;background:#000;border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
  .strat .sico img{width:36px;height:36px;object-fit:contain;filter:brightness(1.12)}
  .strat .sico.noimg{color:var(--acc);font-size:20px}
  .strat .n{font-weight:600;font-size:13.5px;line-height:1.15}
  .strat .d{font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.35}

  .tips{margin:16px 20px 22px;background:#0c1710;border:1px solid #1d3a26;padding:14px 16px}
  .tips .lbl{font-family:"Saira Condensed";font-weight:700;font-size:11.5px;letter-spacing:2px;text-transform:uppercase;color:var(--green);margin-bottom:9px}
  .tips ul{list-style:none}
  .tips li{font-size:13px;padding:3px 0 3px 18px;position:relative;color:#cfe6d4}
  .tips li::before{content:"▸";position:absolute;left:0;color:var(--green)}

  /* ====== Squad-Aufstellung ====== */
  .squad-intro{padding:14px 20px;border-bottom:1px solid var(--line);color:#aeb4ad;font-size:13px}
  .roster{padding:14px 20px 6px;display:grid;gap:13px;grid-template-columns:repeat(auto-fit,minmax(255px,1fr))}
  .pcard{border:1px solid var(--line);background:var(--panel-2);display:flex;flex-direction:column}
  .pcard-head{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#0d1116;border-bottom:2px solid var(--role-c,var(--acc))}
  .pcard-head .pn{font-family:"Oswald";font-weight:700;font-size:13px;letter-spacing:1px;color:#fff;text-transform:uppercase}
  .pcard-head .role{margin-left:auto;font-family:"Saira Condensed";font-weight:700;font-size:11px;letter-spacing:1.5px;
    text-transform:uppercase;color:#0a0c0a;background:var(--role-c,var(--acc));padding:3px 8px}
  .pcard-head .pidx{width:24px;height:24px;flex:0 0 24px;display:flex;align-items:center;justify-content:center;
    border:1px solid var(--role-c,var(--acc));color:var(--role-c,var(--acc));font-family:"Oswald";font-weight:700;font-size:13px}
  .pcard-name{padding:9px 12px 4px;font-family:"Saira Condensed";font-weight:700;font-size:15px;letter-spacing:.5px;color:var(--acc);text-transform:uppercase}
  .ploadout{padding:6px 12px 12px;display:flex;flex-direction:column;gap:7px}
  .prow{display:flex;align-items:center;gap:9px}
  .prow .pic{width:42px;height:32px;flex:0 0 42px;background:#0a0c0d;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden}
  .prow .pic.armory{background:radial-gradient(circle at 50% 35%,#22262b,#0c0e10)}
  .prow .pic img{max-width:100%;max-height:100%;object-fit:contain}
  .prow .pl{font-family:"Saira Condensed";font-weight:700;font-size:9px;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted);line-height:1}
  .prow .pv{font-size:12.5px;font-weight:600;line-height:1.15;margin-top:1px}
  .pslist{display:flex;flex-direction:column;gap:5px;margin-top:2px}
  .psrow{display:flex;align-items:center;gap:8px}
  .psrow .psi{width:28px;height:28px;flex:0 0 28px;background:#000;border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
  .psrow .psi img{width:21px;height:21px;object-fit:contain;filter:brightness(1.12)}
  .psrow .psi.noimg{color:var(--acc);font-size:14px}
  .psrow.sup .psi{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
  .psrow .psn{font-size:11.5px;line-height:1.2;color:var(--text)}
  .psrow .psn span{color:var(--acc);font-weight:600;font-size:10px;letter-spacing:.5px}
  /* Warbond-Filter */
  .wbbox{margin:0 20px 6px}
  .wbrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
  .wblbl{font-family:"Saira Condensed";font-weight:700;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-right:2px}
  .wbnone{font-size:11px;color:var(--green)}
  .wbchip{font-family:"Saira";font-size:10.5px;font-weight:600;letter-spacing:.3px;color:var(--text);
    background:var(--panel-2);border:1px solid var(--line);padding:3px 8px;cursor:pointer;transition:all .12s;line-height:1.3}
  .wbchip b{color:var(--acc);font-weight:700;margin-left:2px}
  .wbchip:hover{border-color:var(--acc)}
  .wbchip.off{opacity:.5;text-decoration:line-through;border-style:dashed}
  .wbchip.off b{color:var(--muted)}
  .wbhint{font-size:10.5px;color:var(--muted);margin-top:6px;line-height:1.4}
  /* Squad-Karte: kompaktere Chips */
  .pcard .wbrow{padding:0 12px 2px}
  .pcard .wblbl{display:none}
  .pcard .wbchip{font-size:9.5px;padding:2px 6px}
  .altbadge{font-family:"Saira Condensed";font-weight:700;font-size:8.5px;letter-spacing:1px;text-transform:uppercase;
    color:#0a0c0a;background:var(--hd-yellow-dim);padding:1px 5px;vertical-align:middle;border-radius:2px}
  .role-tag-row{display:flex;gap:6px;flex-wrap:wrap;padding:2px 0 0}
  /* Sprach-Umschalter */
  .lang-switch{display:flex;align-self:flex-start;border:1px solid var(--line-bright);flex:0 0 auto}
  .langbtn{font-family:"Saira Condensed";font-weight:700;font-size:12px;letter-spacing:1px;padding:5px 11px;
    background:var(--panel-2);color:var(--muted);border:none;cursor:pointer;transition:all .12s}
  .langbtn+.langbtn{border-left:1px solid var(--line-bright)}
  .langbtn.active{background:var(--hd-yellow);color:#0a0c0a}
  .langbtn:hover:not(.active){color:var(--text)}

  footer{margin-top:34px;text-align:center;color:#596059;font-size:11px;letter-spacing:.8px;line-height:1.9}
  footer a{color:var(--hd-yellow-dim);text-decoration:none}
  footer a:hover{color:var(--hd-yellow)}
  footer .fhz{height:6px;margin:0 auto 16px;max-width:240px;
    background:repeating-linear-gradient(135deg,var(--hd-yellow-dim) 0 14px,transparent 14px 28px)}
</style>
</head>
<body data-faction="terminids">
<div class="wrap">
  <div class="hazard"></div>

  <header class="frame">
    <div class="crest"><img src="assets/super_earth.png" alt="Super Earth"></div>
    <div class="titles">
      <div class="kicker">Super Earth · Strategic Command</div>
      <h1><span class="t" data-de="Loadout-Terminal" data-en="Loadout Terminal"></span></h1>
      <div class="sub"><span class="t" data-de="Helldivers 2 · Alle Fraktionen · Schwierigkeit 1–10 · Solo bis 4er-Trupp · Meta: Basis Jan 2026 + Web-Update Juli 2026" data-en="Helldivers 2 · All factions · Difficulty 1–10 · Solo to 4-player squad · Meta: base Jan 2026 + web update July 2026"></span></div>
    </div>
    <div class="lang-switch">
      <button class="langbtn active" data-lang="de">DE</button>
      <button class="langbtn" data-lang="en">EN</button>
    </div>
    <div class="stamp"><span class="t" data-de="Klassifiziert" data-en="Classified"></span></div>
  </header>

  <div class="controls">
    <div class="group frame" style="grid-column:1/-1">
      <h2><span class="num">1</span> <span class="t" data-de="Fraktion / Feindkontakt" data-en="Faction / Contact"></span></h2>
      <div class="fac-opts" id="faction-opts"><!-- dynamisch --></div>
    </div>
    <div class="group">
      <h2><span class="num">2</span> <span class="t" data-de="Schwierigkeitsgrad" data-en="Difficulty"></span></h2>
      <div class="opts" id="band-opts">
        <button class="opt" data-val="leicht"><span class="t" data-de="Leicht" data-en="Easy"></span><small class="t" data-de="Stufe 1–3" data-en="Level 1–3"></small></button>
        <button class="opt" data-val="mittel"><span class="t" data-de="Mittel" data-en="Medium"></span><small class="t" data-de="Stufe 4–6" data-en="Level 4–6"></small></button>
        <button class="opt active" data-val="schwer"><span class="t" data-de="Schwer" data-en="Hard"></span><small class="t" data-de="Stufe 7–10" data-en="Level 7–10"></small></button>
      </div>
    </div>
    <div class="group">
      <h2><span class="num">3</span> <span class="t" data-de="Trupp-Größe" data-en="Squad Size"></span></h2>
      <div class="opts" id="team-opts">
        <button class="opt active" data-val="solo"><span class="t" data-de="Solo" data-en="Solo"></span><small class="t" data-de="1 Helldiver" data-en="1 Helldiver"></small></button>
        <button class="opt" data-val="2"><span class="t" data-de="Duo" data-en="Duo"></span><small class="t" data-de="2 Helldivers" data-en="2 Helldivers"></small></button>
        <button class="opt" data-val="3"><span class="t" data-de="Trio" data-en="Trio"></span><small class="t" data-de="3 Helldivers" data-en="3 Helldivers"></small></button>
        <button class="opt" data-val="4"><span class="t" data-de="Voll" data-en="Full"></span><small class="t" data-de="4 Helldivers" data-en="4 Helldivers"></small></button>
      </div>
    </div>
    <div class="group" id="style-group" style="grid-column:1/-1">
      <h2><span class="num">4</span> <span class="t" data-de="Spielstil / Rolle" data-en="Playstyle / Role"></span> <span id="style-mode" style="font-family:Saira;font-weight:500;letter-spacing:1px;font-size:10px;color:var(--muted)"></span></h2>
      <div class="opts" id="style-opts">
        <button class="opt active" data-val="horde"><span class="t" data-de="Anti-Horde" data-en="Anti-Horde"></span><small class="t" data-de="Massen &amp; Chaff" data-en="Masses &amp; Chaff"></small></button>
        <button class="opt" data-val="heavy"><span class="t" data-de="Anti-Heavy" data-en="Anti-Heavy"></span><small class="t" data-de="Schwere Einheiten" data-en="Heavy units"></small></button>
        <button class="opt" data-val="support"><span class="t" data-de="Allrounder" data-en="All-Rounder"></span><small class="t" data-de="Support &amp; Sustain" data-en="Support &amp; Sustain"></small></button>
      </div>
      <div class="hint" id="style-hint"></div>
    </div>
    <div class="group" style="grid-column:1/-1">

function wbOf(o){
  if(WB_OF[o.val]) return WB_OF[o.val];
  for(const k in WB_ARMOR){ if(o.val.indexOf(k)>=0) return WB_ARMOR[k]; }
  return "base";
}
function altOf(o){
  if(WB_ALT[o.val]) return WB_ALT[o.val];
  for(const k in WB_ALT_ARMOR){ if(o.val.indexOf(k)>=0) return WB_ALT_ARMOR[k]; }
  return o;
}
// Item gegen ausgeschlossene Warbonds auflösen
function resolveItem(o, excl){
  const wb = wbOf(o);
  if(wb!=="base" && excl.has(wb)){ return Object.assign({}, altOf(o), {_alt:true}); }
  return o;
}
// Welche Warbonds braucht der OPTIMALE Build (ohne Ausschlüsse)?
function buildWarbonds(d){
  const set=new Set();
  [d.primary,d.secondary,d.grenade,d.armor].forEach(o=>{const w=wbOf(o); if(w!=="base") set.add(w);});
  return [...set];
}
// Pro-Karte Ausschluss-Sets: "me" wird gespeichert, Mitspieler je Session.
const LS_WB="hd2_my_wb_excluded";
let myExcluded = new Set((()=>{try{return JSON.parse(localStorage.getItem(LS_WB)||"[]")}catch(e){return[]}})());
const squadExcluded = {};
function exclSet(cardKey){
  if(cardKey==="me") return myExcluded;
  if(!squadExcluded[cardKey]) squadExcluded[cardKey]=new Set();
  return squadExcluded[cardKey];
}
function wbChips(cardKey, wbs){
  if(!wbs.length) return `<div class="wbrow"><span class="wblbl">Warbonds:</span><span class="wbnone">nur Basis-Inhalte nötig ✓</span></div>`;
  const excl = exclSet(cardKey);
  const chips = wbs.map(w=>{
    const off = excl.has(w);
    return `<button class="wbchip${off?" off":""}" data-card="${cardKey}" data-wb="${w}" title="${off?'Als vorhanden markieren':'Wegklicken, wenn nicht vorhanden'}">${WARBONDS[w]} <b>${off?'+':'✕'}</b></button>`;
  }).join("");
  return `<div class="wbrow"><span class="wblbl">Warbonds:</span>${chips}</div>`;
}

// ============ STATE & RENDER ============
const EMPTY = new Set();
let state = {faction:"terminids", band:"schwer", style:"horde", team:"solo",
  mode:(()=>{try{return localStorage.getItem("hd2_mode")==="individuell"?"individuell":"optimal"}catch(e){return"optimal"}})()};

function buildOf(fk, role, band){
  const base = FACTIONS[fk].builds[role];
  const ov = (base.bands && base.bands[band]) || {};
  return Object.assign({}, base, ov);
}

function thumb(o, armory){
  if(o.img) return `<div class="thumb${armory?" armory":""}"><img src="assets/${o.img}" alt="${o.val}" loading="lazy"></div>`;
  return `<div class="thumb noimg">▣</div>`;
}
function card(lbl,o,armory){
  const badge = o._alt ? ` <span class="altbadge">${t("Ersatz")}</span>` : "";
  return `<div class="card">${thumb(o,armory)}
    <div><div class="lbl">${t(lbl)}</div><div class="val">${t(o.val)}${badge}</div><div class="why">${t(o.why)}</div></div></div>`;
}
function stratEl(s){
  const ico = s.img ? `<div class="sico"><img src="assets/${s.img}" alt="${s.n}"></div>` : `<div class="sico noimg">▣</div>`;
  return `<div class="strat">${ico}<div><div class="n">${t(s.n)}</div><div class="d">${t(s.d)}</div></div></div>`;
}

function buildFactionButtons(){
  const el = document.getElementById("faction-opts");
  el.innerHTML = Object.entries(FACTIONS).map(([k,f])=>
    `<button class="fac${k===state.faction?" active":""}" data-val="${k}">
       <img src="assets/${f.emblem}" alt="${f.label}"><span class="fl">${f.label}</span>
     </button>`
  ).join("");
}

  const excl = state.mode==="individuell" ? exclSet("me") : EMPTY;
  const rp=resolveItem(d.primary,excl), rs=resolveItem(d.secondary,excl), rg=resolveItem(d.grenade,excl), ra=resolveItem(d.armor,excl);

  document.getElementById("result").innerHTML = `
    <div class="result-head">
      <div class="rh-l">
        <img class="rh-em" src="assets/${fac.emblem}" alt="${fac.label}">
        <div><h3>${fac.label} — ${t(d.name)}</h3><div class="rh-sub">${ROLE_LABEL[state.style]} · ${t("Solo-Einsatz")}</div></div>
      </div>
      <span class="tag">${d.tag} · Solo</span>
    </div>
    <div class="band-banner"><b>${t(bandInfo.t)}</b> — ${t(bandInfo.d)}</div>
    <div class="blurb">${t(d.blurb)}</div>

    ${state.mode==="individuell" ? `<div class="section-lbl">${t("Meine Warbonds")}</div>
    <div class="wbbox">${wbChips("me", Object.keys(WARBONDS))}<div class="wbhint">${t("Klick weg, was du <b>nicht</b> besitzt. Diese Auswahl gilt für alle deine Solo-Builds und wird im Browser gemerkt — gesperrte Items werden automatisch durch Basis-Alternativen ersetzt.")}</div></div>` : ""}

    <div class="section-lbl">${t("Ausrüstung")}</div>
    <div class="grid">
      ${card("Primärwaffe", rp)}
      ${card("Sekundärwaffe", rs)}
      ${card("Granate", rg)}
      ${card("Rüstung", ra, true)}
    </div>

    <div class="section-lbl">${t("Stratageme — 4 Slots (3 Wurfaufrufe + Stützwaffe)")}</div>
    <div class="strats">
      ${strats.map(stratEl).join("")}
      ${stratEl({img:d.support.img, n:d.support.val, d:"Stützwaffe — 1 der 4 Stratagem-Slots."})}
    </div>

    <div class="section-lbl">${t("Stützwaffe (Detail) & Booster")}</div>
    <div class="grid">
      ${card("Stützwaffe", d.support)}
      ${card("Booster", d.booster)}
    </div>

    <div class="tips">
      <div class="lbl">${t("⚡ Einsatz-Tipps")}</div>
      <ul>${d.tips.map(x=>`<li>${t(x)}</li>`).join("")}</ul>
    </div>`;
}

// ---- Squad: ein Loadout pro Spieler ----
function prow(lbl,o,armory){
  const pic = o.img ? `<div class="pic${armory?" armory":""}"><img src="assets/${o.img}" alt=""></div>` : `<div class="pic">▣</div>`;
  const badge = o._alt ? ` <span class="altbadge">${t("Ersatz")}</span>` : "";
  return `<div class="prow">${pic}<div><div class="pl">${t(lbl)}</div><div class="pv">${t(o.val)}${badge}</div></div></div>`;
}
function renderSquad(){
  const fac = FACTIONS[state.faction];
  const size = parseInt(state.team,10);
  const roles = ROSTER[state.faction][size];
  const bandInfo = BANDS[state.band];
  const usedBoost = new Set();

  const cards = roles.map((role,i)=>{
    const d = buildOf(state.faction, role, state.band);
    // Booster squad-weit entdoppeln
    let bName = d.booster.val, bImg = d.booster.img, bWhy = d.booster.why;
    if (usedBoost.has(bName)){
      const free = BOOSTER_POOL.find(n=>!usedBoost.has(n)) || bName;
      bName = free; bImg = BOOSTERS[free]; bWhy = BOOSTER_WHY[free] || "Squad-weiter Booster (kein Doppel).";
    }
    usedBoost.add(bName);
    const rc = ROLE_COLOR[role];
    const cardKey = i===0 ? "me" : "sq"+i;  // Spieler 1 = du (gemerkt), Rest je Session
    const ex = state.mode==="individuell" ? exclSet(cardKey) : EMPTY;
    const rP=resolveItem(d.primary,ex), rS=resolveItem(d.secondary,ex), rG=resolveItem(d.grenade,ex), rA=resolveItem(d.armor,ex);
    // 4 Stratagem-Slots: Stützwaffe (1) + 3 Wurfaufrufe. In HD2 ist die Stützwaffe selbst ein Stratagem.
    const strat4 = [{img:d.support.img, n:d.support.val, sup:true}, ...d.strats.slice(0,3)];
    const psRow = s => `<div class="psrow${s.sup?" sup":""}">`
      + (s.img ? `<div class="psi"><img src="assets/${s.img}" alt="${s.n}"></div>` : `<div class="psi noimg">▣</div>`)
      + `<div class="psn">${t(s.n)}${s.sup?` <span>${t("· Stütze")}</span>`:``}</div></div>`;
    return `<div class="pcard" style="--role-c:${rc}">
      <div class="pcard-head">
        <span class="pidx">${i+1}</span>
        <span class="pn">${t("Spieler")} ${i+1}</span>
        <span class="role">${ROLE_LABEL[role]}</span>
      </div>
      <div class="pcard-name">${t(d.name)}</div>
      ${state.mode==="individuell" ? wbChips(cardKey, buildWarbonds(d)) : ""}
      <div class="ploadout">
        ${prow("Primär", rP)}
        ${prow("Sekundär", rS)}
        ${prow("Granate", rG)}
        ${prow("Rüstung", rA, true)}
        ${prow("Booster", {val:bName, img:bImg})}
        <div>
          <div class="pl" style="margin-bottom:4px">${t("Stratageme — 4 Slots")}</div>
          <div class="pslist">
            ${strat4.map(psRow).join("")}
          </div>
        </div>
      </div>
    </div>`;
  }).join("");

  const roleSummary = roles.map(r=>`<span class="role" style="--role-c:${ROLE_COLOR[r]};background:${ROLE_COLOR[r]};color:#0a0c0a;font-family:'Saira Condensed';font-weight:700;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;padding:3px 8px">${ROLE_LABEL[r]}</span>`).join(" ");

  document.getElementById("result").innerHTML = `
    <div class="result-head">
      <div class="rh-l">
        <img class="rh-em" src="assets/${fac.emblem}" alt="${fac.label}">
        <div><h3>${fac.label} — ${t("Trupp-Aufstellung")}</h3><div class="rh-sub">${size} Helldivers · ${t("Rollenverteilung")}</div></div>
      </div>
      <span class="tag">${size}er-Trupp</span>
    </div>
    <div class="band-banner"><b>${t(bandInfo.t)}</b> — ${t(bandInfo.d)}</div>
    <div class="squad-intro">${t(SQUAD_NOTE[state.faction])}<div class="role-tag-row" style="margin-top:10px">${roleSummary}</div></div>
    <div class="section-lbl">${t("Empfehlung pro Spieler")}</div>
    <div class="roster">${cards}</div>
    <div class="tips" style="margin-top:14px">
      <div class="lbl">${t("⚡ Trupp-Tipps")}</div>
      <ul>
        <li>${t("Booster nicht doppeln — sie wirken squad-weit. Diese Aufstellung vergibt automatisch distinkte Booster.")}</li>
        <li>${t("Stratageme & Eagle-/Orbital-Cooldowns staffeln: nicht alle gleichzeitig zünden, sondern abwechselnd nachlegen.")}</li>
        <li>${t("Anti-Heavy fokussiert Großziele, der Rest hält Chaff & Objectives — bleibt zusammen, deckt euch gegenseitig den Rücken.")}</li>
        <li>${t("Reinforce-Budget teilen: nicht alle gleichzeitig vorpreschen, damit immer jemand zum Wiederbeleben übrig ist.")}</li>
      </ul>
    </div>`;
}

function syncStyleGroup(){
  const solo = state.team === "solo";
  const g = document.getElementById("style-group");
  const mode = document.getElementById("style-mode");
  const hint = document.getElementById("style-hint");
  g.classList.toggle("muted", !solo);
  document.querySelectorAll("#style-opts .opt").forEach(b=>b.disabled = !solo);
  if(solo){
    mode.textContent = "";
    hint.textContent = "";
  } else {
    mode.textContent = t("— im Trupp automatisch verteilt");
    hint.textContent = t("Im Trupp-Modus werden die Rollen automatisch auf die Spieler verteilt (siehe Aufstellung unten). Wähle „Solo“, um ein einzelnes Loadout für deinen Spielstil zu sehen.");
  }
}

function render(){
  document.body.dataset.faction = state.faction;
  syncStyleGroup();
  const mh = document.getElementById("mode-hint");
  if(mh) mh.textContent = state.mode==="individuell"
    ? t("Pro Spieler die vorhandenen Warbonds einstellen — fehlende wegklicken, das Loadout passt sich an.")
    : t("Zeigt das bestmögliche Loadout (als hättet ihr alle Warbonds). Für eure echte Sammlung auf „Individuell“ wechseln.");
  if(state.team === "solo") renderSolo();
  else renderSquad();
}

function wire(id,key,after){
  document.getElementById(id).addEventListener("click", e=>{
    const btn = e.target.closest("[data-val]"); if(!btn || btn.disabled) return;
    state[key] = btn.dataset.val;
    [...e.currentTarget.children].forEach(b=>b.classList.toggle("active", b===btn));
    if(after) after();
    render();
  });
}
buildFactionButtons();
wire("faction-opts","faction", buildFactionButtons);
wire("band-opts","band");
wire("style-opts","style");
wire("team-opts","team");
wire("mode-opts","mode", ()=>{ try{ localStorage.setItem("hd2_mode", state.mode); }catch(e){} });
document.querySelectorAll("#mode-opts .opt").forEach(b=>b.classList.toggle("active", b.dataset.val===state.mode));
// Warbond-Chip an-/abwählen (nur diese Karte rechnet neu)
document.getElementById("result").addEventListener("click", e=>{
  const c = e.target.closest(".wbchip"); if(!c) return;
  const set = exclSet(c.dataset.card), w = c.dataset.wb;
  set.has(w) ? set.delete(w) : set.add(w);
  if(c.dataset.card==="me"){ try{ localStorage.setItem(LS_WB, JSON.stringify([...myExcluded])); }catch(e){} }
  render();
});
// Sprach-Umschalter DE/EN
document.querySelector(".lang-switch").addEventListener("click", e=>{
  const b = e.target.closest(".langbtn"); if(!b) return;
  LANG = b.dataset.lang;
  try{ localStorage.setItem("hd2_lang", LANG); }catch(e){}
  document.querySelectorAll(".langbtn").forEach(x=>x.classList.toggle("active", x===b));
  applyStaticLang();
  render();
});
// Initialzustand
document.querySelectorAll(".langbtn").forEach(x=>x.classList.toggle("active", x.dataset.lang===LANG));
applyStaticLang();
render();
</script>
